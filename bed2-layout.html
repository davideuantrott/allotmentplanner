<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bed 2 &mdash; Potatoes, Beetroot &amp; Roots | 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FAF6F1;--text:#3E2C23;--text-light:#7A6355;--accent:#C75B39;
  --accent-soft:#E8A87C;--card:#FFFFFF;--shadow:rgba(62,44,35,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1100px;margin:0 auto;padding:20px 12px}
header{text-align:center;margin-bottom:24px}
header h1{font-family:'Lora',serif;font-size:26px;font-weight:600;margin-bottom:2px}
header .sub{font-size:13px;color:var(--text-light)}
.months{display:flex;justify-content:center;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.mbtn{padding:7px 13px;border:2px solid transparent;border-radius:20px;background:var(--card);
  color:var(--text-light);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;transition:all .2s;box-shadow:0 1px 3px var(--shadow)}
.mbtn:hover{border-color:var(--accent-soft);color:var(--text)}
.mbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.zoom-bar{display:flex;justify-content:center;gap:8px;margin-bottom:12px;align-items:center}
.zbtn{width:34px;height:34px;border-radius:50%;border:2px solid #DDD3C9;background:var(--card);
  font-size:18px;font-weight:700;color:var(--text);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .15s}
.zbtn:hover{border-color:var(--accent);color:var(--accent)}
.zoom-label{font-size:12px;color:var(--text-light);min-width:48px;text-align:center;font-weight:600}
.bed-wrap{display:flex;justify-content:center;overflow:auto;margin-bottom:24px;
  border:1px solid #EDE4DA;border-radius:12px;background:#FDFBF8;padding:8px;max-height:80vh}
.bed-wrap svg{display:block;transition:transform .15s}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:center;margin-bottom:24px;
  padding:14px 20px;background:var(--card);border-radius:10px;box-shadow:0 2px 6px var(--shadow)}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.leg-sw{width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.08);flex-shrink:0}
.notes{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 8px var(--shadow);margin-bottom:20px}
.notes h2{font-family:'Lora',serif;font-size:18px;font-weight:600;margin-bottom:12px}
.tbar{display:flex;gap:2px;margin-bottom:14px;border-bottom:2px solid #EDE4DA;overflow-x:auto}
.tbtn{padding:7px 14px;border:none;background:transparent;color:var(--text-light);
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tbtn:hover{color:var(--text)}.tbtn.on{color:var(--accent);border-bottom-color:var(--accent)}
.tcont{display:none}.tcont.on{display:block}
.notes h3{font-size:14px;font-weight:700;color:var(--accent);margin:14px 0 6px}
.notes p,.notes li{font-size:13px;line-height:1.7}
.notes ul{list-style:none;padding:0}
.notes ul li{padding:3px 0 3px 18px;position:relative}
.notes ul li::before{content:'\2022';position:absolute;left:3px;color:var(--accent-soft);font-weight:700}
.wb{display:inline-block;background:#FFF3CD;color:#856404;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:700;margin-left:3px}
.ob{display:inline-block;background:#D4EDDA;color:#155724;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:700;margin-left:3px}
.db{display:inline-block;background:#F8D7DA;color:#721C24;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:700;margin-left:3px}
.pg-row{background:#FDFBF8;border:1px solid #EDE4DA;border-radius:8px;padding:14px 16px;margin-bottom:10px}
.pg-row h4{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text)}
.pg-row p{font-size:12px;margin-bottom:4px}
.pg-row .pg-spec{font-family:'Courier New',monospace;font-size:11px;background:#F5EFE6;
  padding:6px 10px;border-radius:4px;margin-top:6px;line-height:1.6;white-space:pre-wrap}
.tip{position:fixed;background:var(--text);color:#fff;padding:9px 13px;border-radius:7px;
  font-size:11px;font-family:'Nunito',sans-serif;line-height:1.5;pointer-events:none;z-index:1000;
  max-width:260px;opacity:0;transition:opacity .12s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tip.vis{opacity:1}
.back-link{display:inline-block;margin-bottom:16px;color:var(--accent);font-size:13px;font-weight:700;text-decoration:none}
.back-link:hover{text-decoration:underline}
@media print{
  .months,.zoom-bar,.tbar,.tbtn{display:none!important}
  .tcont{display:block!important}
  .notes{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .bed-wrap{page-break-after:always;border:none;max-height:none}
}
@media(max-width:600px){.mbtn{padding:5px 8px;font-size:10px}header h1{font-size:20px}}
</style>
</head>
<body>
<div class="container">
<a href="index.html" class="back-link">&larr; Back to planner</a>
<header>
  <h1>Bed 2 &mdash; Potatoes, Beetroot &amp; Roots</h1>
  <p class="sub">2.4m &times; 1.2m &middot; No-dig raised bed &middot; 2026</p>
</header>
<div class="months" id="mBar"></div>
<div class="zoom-bar">
  <button class="zbtn" id="zOut">&minus;</button>
  <span class="zoom-label" id="zLbl">100%</span>
  <button class="zbtn" id="zIn">+</button>
  <button class="zbtn" id="zFit" style="font-size:12px;width:auto;padding:0 10px;border-radius:6px">Fit</button>
</div>
<div class="bed-wrap" id="bedWrap"></div>
<div class="legend" id="leg"></div>
<div class="notes">
  <h2>Layout Notes &amp; Planting Guide</h2>
  <div class="tbar" id="tBar"></div>
  <div id="tConts"></div>
</div>
</div>
<div class="tip" id="tip"></div>

<script>
const BW=1200,BH=2400,SC=0.5;
const SW=BW*SC,SH=BH*SC;
const M={t:55,r:110,b:55,l:55};
const TW=SW+M.l+M.r,TH=SH+M.t+M.b;
const MONTHS=['May','Jun','Jul','Aug','Sep','Oct'];
const FM={May:'May',Jun:'June',Jul:'July',Aug:'August',Sep:'September',Oct:'October'};
let curM='May',zoom=1;

function bx(mm){return M.l+mm*SC}
function by(mm){return M.t+(BH-mm)*SC}

// CASABLANCA (1st Early): 2 rows x 4 tubers. Plant 6 May. Harvest late Jun/Jul.
const casa={
  name:'Casablanca',type:'1st Early',col:'#8B6F47',colLight:'rgba(139,111,71,0.12)',
  rows:[
    {y:150,pts:[{x:150},{x:450},{x:750},{x:1050}]},
    {y:550,pts:[{x:150},{x:450},{x:750},{x:1050}]},
  ],
  plantM:'May',harvM:'Jul',
};

// CHARLOTTE (2nd Early): 2 rows x 4 tubers. Plant 6 May. Harvest Aug.
const charl={
  name:'Charlotte',type:'2nd Early',col:'#7B5B3A',colLight:'rgba(123,91,58,0.12)',
  rows:[
    {y:850,pts:[{x:150},{x:450},{x:750},{x:1050}]},
    {y:1450,pts:[{x:150},{x:450},{x:750},{x:1050}]},
  ],
  plantM:'May',harvM:'Aug',
};

// SETANTA (Maincrop): 2 rows x 3 tubers. Plant 6 May. Harvest Sep-Oct.
const set={
  name:'Setanta',type:'Maincrop',col:'#6B4423',colLight:'rgba(107,68,35,0.12)',
  rows:[
    {y:1750,pts:[{x:150},{x:600},{x:1050}]},
    {y:2250,pts:[{x:150},{x:600},{x:1050}]},
  ],
  plantM:'May',harvM:'Oct',
};

const varieties=[casa,charl,set];

// SPINACH: row at y=1150 between Charlotte rows
const spinach={y:1150,col:'#5A8C3A',plantM:'May',harvM:'Jul',n:7,sp:150,x1:150};

// BEETROOT: south end, 5 succession sowings
const beetrowY=[100,200,300,400,500]; // stacked bands

// NASTURTIUMS: 4 corners
const nast=[
  {x:150,y:80,lab:'SW'},{x:1050,y:80,lab:'SE'},
  {x:150,y:2320,lab:'NW'},{x:1050,y:2320,lab:'NE'},
];

function mi(m){return MONTHS.indexOf(m)}

function getRidgeWidth(variety, month) {
  const mi2 = MONTHS.indexOf(month);
  const pi = MONTHS.indexOf(variety.plantM);
  if (mi2 < pi) return 0;
  const weeksIn = (mi2 - pi) * 4;
  if (variety === casa) {
    if (weeksIn < 3) return 0;
    if (weeksIn < 6) return 80;
    return 160;
  }
  if (variety === charl) {
    if (weeksIn < 3) return 0;
    if (weeksIn < 6) return 80;
    if (weeksIn < 9) return 160;
    return 240;
  }
  if (variety === set) {
    if (weeksIn < 4) return 0;
    if (weeksIn < 7) return 80;
    if (weeksIn < 10) return 160;
    return 240;
  }
  return 0;
}

function getState(month){
  const idx=mi(month);
  const pts=[],zones=[],ridges=[];
  let spinachVisible=false;

  varieties.forEach(v=>{
    const pi=mi(v.plantM), hi=mi(v.harvM);
    if(idx<pi||idx>hi) return;
    const weeksIn=(idx-pi)*4;
    const ph=weeksIn<=2?'sprouting':weeksIn<=6?'growing':weeksIn<=10?'flowering':'senescing';
    const r=weeksIn<=2?8:weeksIn<=6?14:weeksIn<=10?18:14;
    const rw=getRidgeWidth(v,month);
    zones.push({id:v.name.toLowerCase(),lab:`${v.name} (${v.type})`,
      yR:[v.rows[0].y-Math.max(rw,50), v.rows[v.rows.length-1].y+Math.max(rw,50)],
      col:v.colLight});
    v.rows.forEach(row=>{
      if(rw>0) ridges.push({y:row.y,rw,col:v.col});
      row.pts.forEach(p=>{
        pts.push({x:p.x,y:row.y,r,col:v.col,
          lab:`${v.name} (${v.type})`,
          inf:`Phase: ${ph}\nPlanted: 6 May\nHarvest: ${FM[v.harvM]}\nRidge width: ${rw}mm each side`,
          z:'potato'});
      });
    });
  });

  // Spinach
  {
    const si=mi(spinach.plantM), hi=mi(spinach.harvM);
    if(idx>=si && idx<=hi){
      spinachVisible=true;
      const wk=(idx-si)*4;
      const ph=wk<=3?'germinating':wk<=6?'growing':'ready to cut';
      const r=wk<=3?3:wk<=6?6:8;
      for(let i=0;i<spinach.n;i++){
        pts.push({x:spinach.x1+i*spinach.sp, y:spinach.y, r, col:spinach.col,
          lab:'Spinach (Medania)',
          inf:`Between Charlotte rows\nPhase: ${ph}\nSow: 11 May · Harvest: Jun/Jul\nCut-and-come-again`,
          z:'spinach'});
      }
    }
  }

  // Nasturtiums from May
  if(idx>=0){
    const wk=idx*4;
    const r=Math.min(wk<=4?8:wk<=8?12:15,15);
    const spr=wk<=4?60:wk<=8?120:180;
    nast.forEach(n=>pts.push({x:n.x,y:n.y,r,col:'#E8A020',
      lab:`Nasturtium ${n.lab} (Tom Thumb)`,
      inf:`Planted 18 May\nCompact variety ~ sprawl ${spr}mm\nAphid trap crop`,
      z:'nast',spr}));
  }

  return {pts,zones,ridges,spinachVisible};
}

function render(month){
  const st=getState(month);
  const ns='http://www.w3.org/2000/svg';
  let s=`<svg xmlns="${ns}" viewBox="0 0 ${TW} ${TH}" width="${TW}" height="${TH}" font-family="Nunito,sans-serif">`;
  s+=`<defs>
    <pattern id="cp" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#C4A97D"/>
      <circle cx="3" cy="4" r="1" fill="#B09570" opacity=".4"/>
      <circle cx="8" cy="8" r=".7" fill="#A8875E" opacity=".3"/>
    </pattern>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity=".1"/></filter>
  </defs>`;
  s+=`<rect width="${TW}" height="${TH}" fill="#FAF6F1" rx="6"/>`;
  const fp=5;
  s+=`<rect x="${M.l-fp}" y="${M.t-fp}" width="${SW+fp*2}" height="${SH+fp*2}" rx="3" fill="#5C3F2E" filter="url(#sh)"/>`;
  s+=`<rect x="${M.l-fp+1}" y="${M.t-fp+1}" width="${SW+fp*2-2}" height="${SH+fp*2-2}" rx="2" fill="#6B4E3D"/>`;
  s+=`<rect x="${M.l}" y="${M.t}" width="${SW}" height="${SH}" fill="url(#cp)" rx="1"/>`;

  st.zones.forEach(z=>{
    const yt=by(z.yR[1]),yb=by(z.yR[0]),h=yb-yt;
    if(h>0) s+=`<rect x="${M.l}" y="${yt}" width="${SW}" height="${h}" fill="${z.col}"/>`;
    const label=z.lab.split('(')[0].trim();
    const sub=z.lab.match(/\(.*\)/)?.[0]||'';
    s+=`<text x="${M.l+SW+6}" y="${yt+h/2-5}" font-size="8.5" fill="#7A6355" dominant-baseline="middle" font-weight="700">${label}</text>`;
    s+=`<text x="${M.l+SW+6}" y="${yt+h/2+7}" font-size="7.5" fill="#A08B7A" dominant-baseline="middle" font-style="italic">${sub}</text>`;
  });

  st.ridges.forEach(r=>{
    const cy=by(r.y);
    const halfH=r.rw*SC;
    if(halfH>0){
      s+=`<rect x="${M.l}" y="${cy-halfH}" width="${SW}" height="${halfH*2}" fill="${r.col}" opacity=".12" rx="2"/>`;
      s+=`<line x1="${M.l}" y1="${cy-halfH}" x2="${M.l+SW}" y2="${cy-halfH}" stroke="${r.col}" stroke-width=".5" stroke-dasharray="3,2" opacity=".35"/>`;
      s+=`<line x1="${M.l}" y1="${cy+halfH}" x2="${M.l+SW}" y2="${cy+halfH}" stroke="${r.col}" stroke-width=".5" stroke-dasharray="3,2" opacity=".35"/>`;
    }
  });

  st.pts.filter(p=>p.z==='nast'&&p.spr).forEach(p=>{
    s+=`<circle cx="${bx(p.x)}" cy="${by(p.y)}" r="${p.spr*SC}" fill="rgba(232,160,32,.06)" stroke="rgba(232,160,32,.18)" stroke-width=".8" stroke-dasharray="3,2.5"/>`;
  });

  if(st.spinachVisible){
    const sy=by(spinach.y);
    s+=`<line x1="${bx(spinach.x1)}" y1="${sy}" x2="${bx(spinach.x1+(spinach.n-1)*spinach.sp)}" y2="${sy}" stroke="${spinach.col}" stroke-width="1.2" opacity=".4"/>`;
  }

  st.pts.forEach(p=>{
    const cx=bx(p.x),cy=by(p.y),r=Math.max(p.r*SC,2.5);
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.col}" stroke="#fff" stroke-width=".8" opacity=".85" class="dot" data-l="${esc(p.lab)}" data-i="${esc(p.inf)}"/>`;
  });

  const rY=M.t+SH+7;
  for(let x=0;x<=1200;x+=200){
    const sx=bx(x);
    s+=`<line x1="${sx}" y1="${rY}" x2="${sx}" y2="${rY+6}" stroke="#A08B7A" stroke-width=".8"/>`;
    s+=`<text x="${sx}" y="${rY+15}" font-size="7" fill="#A08B7A" text-anchor="middle">${x/10}cm</text>`;
  }
  s+=`<line x1="${bx(0)}" y1="${rY+3}" x2="${bx(1200)}" y2="${rY+3}" stroke="#A08B7A" stroke-width=".4"/>`;
  for(let y=0;y<=2400;y+=200){
    const sy=by(y),rx=M.l-6;
    s+=`<line x1="${rx-5}" y1="${sy}" x2="${rx}" y2="${sy}" stroke="#A08B7A" stroke-width=".8"/>`;
    if(y%400===0) s+=`<text x="${rx-8}" y="${sy}" font-size="7" fill="#A08B7A" text-anchor="end" dominant-baseline="middle">${y/10}</text>`;
  }
  s+=`<g transform="translate(${M.l+SW/2},${M.t-26})"><polygon points="0,-10 3.5,0 -3.5,0" fill="#3E2C23"/><text x="0" y="-14" font-size="9" fill="#3E2C23" text-anchor="middle" font-weight="800">N</text></g>`;
  s+=`<g transform="translate(${M.l},${M.t+SH+34})"><rect width="${500*SC}" height="2.5" fill="#3E2C23" rx="1"/><text x="${500*SC/2}" y="12" font-size="8" fill="#3E2C23" text-anchor="middle" font-weight="700">50cm</text></g>`;
  s+=`<text x="${TW/2}" y="16" font-size="13" fill="#3E2C23" text-anchor="middle" font-weight="700" font-family="Lora,serif">${FM[month]} 2026</text>`;
  s+=`</svg>`;
  return s;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

const zoomLevels=[0.5,0.65,0.8,1,1.2,1.5];
let zIdx=3;
function applyZoom(){
  zoom=zoomLevels[zIdx];
  const svg=document.querySelector('#bedWrap svg');
  if(svg){svg.style.transform=`scale(${zoom})`;svg.style.transformOrigin='top center'}
  document.getElementById('zLbl').textContent=Math.round(zoom*100)+'%';
}
function fitZoom(){
  const wrap=document.getElementById('bedWrap');
  const ww=wrap.clientWidth-20;
  let best=0;
  zoomLevels.forEach((z,i)=>{if(z<=ww/TW+0.05)best=i});
  zIdx=best;applyZoom();
}

function tabHTML(id){
  if(id==='spatial') return `
<h3>Zone Layout (south to north)</h3>
<ul>
  <li><strong>Casablanca zone</strong> &mdash; rows at y=150mm and y=550mm. 2 rows &times; 4 tubers. 30cm in-row. Row gap 400mm. Planted 6 May, harvest late Jun/Jul.</li>
  <li><strong>Charlotte zone</strong> &mdash; rows at y=850mm and y=1450mm. 2 rows &times; 4 tubers. 30cm in-row. Row gap 600mm. Spinach intercrop at y=1150mm between rows.</li>
  <li><strong>Setanta zone</strong> &mdash; rows at y=1750mm and y=2250mm. 2 rows &times; 3 tubers. 40cm in-row. Row gap 500mm. Maincrop &mdash; harvest Sep/Oct, store for winter.</li>
</ul>
<h3>Earthing-Up</h3>
<ul>
  <li>All earthing-up uses compost brought in from outside the bed. Never use the bed's existing surface layer.</li>
  <li><strong>Casablanca</strong>: 2 stages. Ridge reaches 160mm each side. Stage 1 ~2 weeks after shoots emerge, stage 2 ~4 weeks.</li>
  <li><strong>Charlotte</strong>: 3 stages. Ridge reaches 240mm each side. Stage 3: spinach must be harvested first.</li>
  <li><strong>Setanta</strong>: 3 stages. Ridge reaches 240mm each side. Row gap 500mm &mdash; ridges will merge. <span class="wb">&#9888; Very tight</span></li>
</ul>`;

  if(id==='calendar') return `
<h3>Month-by-Month Actions</h3>
<ul>
  <li><strong>May</strong>: <strong>Plant all potatoes 6 May</strong> &mdash; Casablanca &amp; Charlotte 30cm apart 12cm deep, Setanta 40cm apart 15cm deep. Sow spinach at y=1150mm. Earth up as shoots emerge. Plant nasturtiums 4 corners (18 May).</li>
  <li><strong>Jun</strong>: Earth up Charlotte stage 2, Setanta stage 1. Harvest spinach before Charlotte stage 3. Casablanca nearly ready (flowering).</li>
  <li><strong>Jul</strong>: <strong>Harvest Casablanca</strong>. Earth up Setanta stage 3. Charlotte flowering.</li>
  <li><strong>Aug</strong>: <strong>Harvest Charlotte</strong>. Setanta at peak &mdash; do not disturb. Water in dry spells.</li>
  <li><strong>Sep</strong>: Setanta foliage yellowing. Cut haulm, leave tubers 2 weeks to set skins.</li>
  <li><strong>Oct</strong>: <strong>Harvest Setanta</strong>. Clear all debris. Apply fresh compost. Season complete.</li>
</ul>`;

  if(id==='guide') return `
<h3>Planting Guide &mdash; Exact Positions</h3>
<p>All measurements from the <strong>inner face</strong> of the timber frame. &ldquo;West&rdquo; = left when facing north.</p>

<div class="pg-row">
  <h4>Casablanca (1st Early) &mdash; 2 rows &times; 4 tubers = 8 total, planted 6 May</h4>
  <div class="pg-spec">Row A: 15cm from south frame
Row B: 55cm from south frame
4 tubers per row at 30cm intervals.
Positions from west: 15cm, 45cm, 75cm, 105cm
Plant 10-12cm deep, rose end up.</div>
</div>

<div class="pg-row">
  <h4>Charlotte (2nd Early) &mdash; 2 rows &times; 4 tubers = 8 total, planted 6 May</h4>
  <div class="pg-spec">Row A: 85cm from south frame
Row B: 145cm from south frame
4 tubers per row at 30cm intervals.
Positions from west: 15cm, 45cm, 75cm, 105cm</div>
</div>

<div class="pg-row">
  <h4>Spinach (Medania) &mdash; intercrop, sow 11 May</h4>
  <div class="pg-spec">Single row at 115cm from south (between Charlotte rows).
7 seeds at 15cm intervals, from 15cm to 105cm from west.
Must be fully harvested before Charlotte stage 3 earthing-up (mid-Jun).</div>
</div>

<div class="pg-row">
  <h4>Setanta (Maincrop) &mdash; 2 rows &times; 3 tubers = 6 total, planted 6 May</h4>
  <div class="pg-spec">Row A: 175cm from south frame
Row B: 225cm from south frame
3 tubers per row at 40cm intervals.
Positions from west: 15cm, 60cm, 105cm</div>
</div>

<div class="pg-row">
  <h4>Nasturtiums (Tom Thumb) &mdash; 4 corners, plant 18 May</h4>
  <div class="pg-spec">SW: 8cm from south, 15cm from west
SE: 8cm from south, 105cm from west
NW: 232cm from south, 15cm from west
NE: 232cm from south, 105cm from west
Use compact Tom Thumb variety only.</div>
</div>`;

  return '';
}

function init(){
  const mb=document.getElementById('mBar');
  MONTHS.forEach(m=>{
    const b=document.createElement('button');
    b.className='mbtn'+(m===curM?' on':'');
    b.textContent=m;b.onclick=()=>selM(m);mb.appendChild(b);
  });
  document.getElementById('zIn').onclick=()=>{if(zIdx<zoomLevels.length-1){zIdx++;applyZoom()}};
  document.getElementById('zOut').onclick=()=>{if(zIdx>0){zIdx--;applyZoom()}};
  document.getElementById('zFit').onclick=fitZoom;

  const ld=[
    {c:'#8B6F47',l:'Casablanca'},{c:'#7B5B3A',l:'Charlotte'},{c:'#6B4423',l:'Setanta'},
    {c:'#5A8C3A',l:'Spinach'},{c:'#E8A020',l:'Nasturtium'}
  ];
  const lg=document.getElementById('leg');
  ld.forEach(l=>{
    const d=document.createElement('div');d.className='leg-item';
    d.innerHTML=`<span class="leg-sw" style="background:${l.c}"></span>${l.l}`;
    lg.appendChild(d);
  });

  const tabs=[
    {id:'spatial',l:'Spatial Model'},{id:'calendar',l:'Calendar'},{id:'guide',l:'Planting Guide'}
  ];
  const tb=document.getElementById('tBar'),tc=document.getElementById('tConts');
  tabs.forEach((t,i)=>{
    const b=document.createElement('button');b.className='tbtn'+(i===0?' on':'');
    b.textContent=t.l;b.onclick=()=>selT(t.id);tb.appendChild(b);
    const d=document.createElement('div');d.className='tcont'+(i===0?' on':'');
    d.id='t-'+t.id;d.innerHTML=tabHTML(t.id);tc.appendChild(d);
  });
  renderM();
  setTimeout(fitZoom,100);
}

function selM(m){curM=m;document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on',b.textContent===m));renderM()}
function renderM(){document.getElementById('bedWrap').innerHTML=render(curM);applyZoom();tips()}
function selT(id){
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tcont').forEach(c=>c.classList.remove('on'));
  document.getElementById('t-'+id).classList.add('on');
  const map={spatial:'Spatial Model',calendar:'Calendar',guide:'Planting Guide'};
  document.querySelectorAll('.tbtn').forEach(b=>{if(b.textContent===map[id])b.classList.add('on')});
}
function tips(){
  const tip=document.getElementById('tip');
  document.querySelectorAll('.dot').forEach(d=>{
    d.style.cursor='pointer';
    d.addEventListener('mouseenter',e=>{const l=e.target.getAttribute('data-l'),i=e.target.getAttribute('data-i');if(i){tip.innerHTML=`<strong>${l}</strong><br>${i.replace(/\n/g,'<br>')}`;tip.classList.add('vis')}});
    d.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-12)+'px'});
    d.addEventListener('mouseleave',()=>tip.classList.remove('vis'));
    d.addEventListener('touchstart',e=>{
      const l=e.target.getAttribute('data-l'),i=e.target.getAttribute('data-i');
      if(i){const r=e.target.getBoundingClientRect();tip.innerHTML=`<strong>${l}</strong><br>${i.replace(/\n/g,'<br>')}`;tip.style.left=(r.left+20)+'px';tip.style.top=(r.top-60)+'px';tip.classList.add('vis');setTimeout(()=>tip.classList.remove('vis'),3000)}
    },{passive:true});
  });
}
init();
</script>
</body>
</html>
